components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session cookie set by the server after login

  schemas:
    PaginationMetadata:
      type: object
      properties:
        nextCursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page. Null when no further pages exist.
        hasMore:
          type: boolean
          description: True when additional records exist beyond this page.
        limit:
          type: integer
          description: Page size used for this response.
      required: [nextCursor, hasMore, limit]

    PaginatedStudentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Student"
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"
      required: [items, pagination]

    PaginatedAssignmentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"
      required: [items, pagination]

    PaginatedAssessmentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Assessment"
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"
      required: [items, pagination]

    PaginatedCourseList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Course"
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"
      required: [items, pagination]

    PaginatedNoteList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Note"
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"
      required: [items, pagination]

    PaginatedAnnouncementList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Announcement"
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"
      required: [items, pagination]

    Enrollment:
      type: object
      properties:
        id:
          type: integer
        courseId:
          type: integer
        studentId:
          type: integer
        enrolledAt:
          type: string
        enrolledBy:
          type: integer
        isActive:
          type: boolean
        droppedAt:
          type: string
          nullable: true
        droppedBy:
          type: integer
          nullable: true
      required: [id, courseId, studentId, enrolledAt, enrolledBy, isActive]

    EnrollStudentBody:
      type: object
      properties:
        studentId:
          type: integer
      required: [studentId]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    MonitoringStatus:
      type: object
      required: [status, version, uptime, database, backup, replication, alerts]
      properties:
        status:
          type: string
        version:
          type: string
        uptime:
          type: integer
        database:
          type: object
          required: [status, queryCount, queryFailures, avgQueryMs]
          properties:
            status:
              type: string
            detail:
              type: string
            queryCount:
              type: integer
            queryFailures:
              type: integer
            avgQueryMs:
              type: integer
        backup:
          type: object
          required: [configured, runs, failures]
          properties:
            configured:
              type: boolean
            runs:
              type: integer
            failures:
              type: integer
            lastRunAt:
              type: string
              nullable: true
        replication:
          type: object
          required: [configured]
          properties:
            configured:
              type: boolean
        alerts:
          type: object
          required: [active, acknowledged, resolved]
          properties:
            active:
              type: integer
            acknowledged:
              type: integer
            resolved:
              type: integer

    MonitoringSummary:
      type: object
      required: [requests, auth, latency, slowestEndpoints, database, backup, process]
      properties:
        requests:
          type: object
          required: [total, errors, avgDurationMs]
          properties:
            total:
              type: integer
            errors:
              type: integer
            byStatus:
              type: object
              additionalProperties:
                type: integer
            avgDurationMs:
              type: integer
        auth:
          type: object
          required: [loginAttempts, loginFailures, rateLimitHits]
          properties:
            loginAttempts:
              type: integer
            loginFailures:
              type: integer
            rateLimitHits:
              type: integer
        latency:
          type: object
          required: [p50, p95, p99, sampleSize]
          properties:
            p50:
              type: integer
            p95:
              type: integer
            p99:
              type: integer
            sampleSize:
              type: integer
        slowestEndpoints:
          type: array
          items:
            type: object
            required: [path, p95, p99, count]
            properties:
              path:
                type: string
              p95:
                type: integer
              p99:
                type: integer
              count:
                type: integer
        database:
          type: object
          required: [queryCount, queryFailures, avgQueryMs]
          properties:
            queryCount:
              type: integer
            queryFailures:
              type: integer
            avgQueryMs:
              type: integer
        backup:
          type: object
          required: [runs, failures]
          properties:
            runs:
              type: integer
            failures:
              type: integer
            lastRunAt:
              type: string
              nullable: true
        process:
          type: object
          required: [startedAt, uptimeSeconds]
          properties:
            startedAt:
              type: string
            uptimeSeconds:
              type: integer

    SloErrorBudget:
      type: object
      required: [totalSeconds, consumedSeconds, remainingSeconds, consumedPercent, burnRate, status]
      properties:
        totalSeconds:
          type: integer
        consumedSeconds:
          type: integer
        remainingSeconds:
          type: integer
        consumedPercent:
          type: number
        burnRate:
          type: number
        status:
          type: string
          enum: [healthy, at_risk, exhausted]

    SloResult:
      type: object
      required: [id, name, description, target, targetLabel, current, currentLabel, compliant, errorBudget, sampleBasis]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        target:
          type: number
        targetLabel:
          type: string
        current:
          type: number
        currentLabel:
          type: string
        compliant:
          type: boolean
        errorBudget:
          $ref: "#/components/schemas/SloErrorBudget"
        sampleBasis:
          type: string

    SloReport:
      type: object
      required: [evaluatedAt, windowSeconds, elapsedSeconds, slos, summary]
      properties:
        evaluatedAt:
          type: string
        windowSeconds:
          type: integer
        elapsedSeconds:
          type: integer
        slos:
          type: array
          items:
            $ref: "#/components/schemas/SloResult"
        summary:
          type: object
          required: [total, compliant, atRisk, breached]
          properties:
            total:
              type: integer
            compliant:
              type: integer
            atRisk:
              type: integer
            breached:
              type: integer

    ServiceAvailability:
      type: object
      required: [uptimeSeconds, downtimeSeconds, availabilityPct, status]
      properties:
        uptimeSeconds:
          type: integer
        downtimeSeconds:
          type: integer
        availabilityPct:
          type: number
        status:
          type: string
          enum: [healthy, degraded, down]

    OutageEvent:
      type: object
      required: [id, service, startedAt, endedAt, durationSeconds, resolved]
      properties:
        id:
          type: string
        service:
          type: string
        startedAt:
          type: string
        endedAt:
          type: string
          nullable: true
        durationSeconds:
          type: integer
          nullable: true
        resolved:
          type: boolean

    AvailabilityReport:
      type: object
      required: [sessionStartedAt, sessionUptimeSeconds, database, overall, outages, outageCount, longestOutageSeconds, capacityIndicators]
      properties:
        sessionStartedAt:
          type: string
        sessionUptimeSeconds:
          type: integer
        database:
          $ref: "#/components/schemas/ServiceAvailability"
        overall:
          $ref: "#/components/schemas/ServiceAvailability"
        outages:
          type: array
          items:
            $ref: "#/components/schemas/OutageEvent"
        outageCount:
          type: integer
        longestOutageSeconds:
          type: integer
        capacityIndicators:
          type: object
          required: [requestsPerMinute, requestGrowthTrend, estimatedDailyRequests, backupStorageIndicator, dbQueryLoad, sessionUptimeHours]
          properties:
            requestsPerMinute:
              type: number
            requestGrowthTrend:
              type: string
              enum: [stable, growing, unknown]
            estimatedDailyRequests:
              type: integer
            backupStorageIndicator:
              type: string
              enum: [none, active, failing]
            dbQueryLoad:
              type: string
              enum: [low, medium, high]
            sessionUptimeHours:
              type: number

    OperationsReport:
      type: object
      required: [generatedAt, reportPeriod, uptime, requests, authentication, database, backup, alerts, slo, capacity, recommendations]
      properties:
        generatedAt:
          type: string
        reportPeriod:
          type: object
          required: [startedAt, durationSeconds, durationLabel]
          properties:
            startedAt:
              type: string
            durationSeconds:
              type: integer
            durationLabel:
              type: string
        uptime:
          type: object
          required: [availabilityPct, uptimeSeconds, downtimeSeconds]
          properties:
            availabilityPct:
              type: number
            uptimeSeconds:
              type: integer
            downtimeSeconds:
              type: integer
        requests:
          type: object
          required: [total, errors, errorRatePct, avgDurationMs, requestsPerMinute]
          properties:
            total:
              type: integer
            errors:
              type: integer
            errorRatePct:
              type: number
            avgDurationMs:
              type: integer
            requestsPerMinute:
              type: number
        authentication:
          type: object
          required: [totalAttempts, failures, failureRatePct, rateLimitHits]
          properties:
            totalAttempts:
              type: integer
            failures:
              type: integer
            failureRatePct:
              type: number
            rateLimitHits:
              type: integer
        database:
          type: object
          required: [queryCount, queryFailures, failureRatePct, avgQueryMs]
          properties:
            queryCount:
              type: integer
            queryFailures:
              type: integer
            failureRatePct:
              type: number
            avgQueryMs:
              type: integer
        backup:
          type: object
          required: [runs, failures, successRatePct, lastRunAt]
          properties:
            runs:
              type: integer
            failures:
              type: integer
            successRatePct:
              type: number
            lastRunAt:
              type: string
              nullable: true
        alerts:
          type: object
          required: [total, active, acknowledged, resolved, criticalCount, highCount, mediumCount, lowCount]
          properties:
            total:
              type: integer
            active:
              type: integer
            acknowledged:
              type: integer
            resolved:
              type: integer
            criticalCount:
              type: integer
            highCount:
              type: integer
            mediumCount:
              type: integer
            lowCount:
              type: integer
        slo:
          type: object
          required: [compliant, total, breached, overallHealthLabel]
          properties:
            compliant:
              type: integer
            total:
              type: integer
            breached:
              type: array
              items:
                type: string
            overallHealthLabel:
              type: string
              enum: [excellent, good, at_risk, critical]
        capacity:
          type: object
          required: [requestsPerMinute, estimatedDailyRequests, dbQueryLoad, backupStorageIndicator]
          properties:
            requestsPerMinute:
              type: number
            estimatedDailyRequests:
              type: integer
            dbQueryLoad:
              type: string
            backupStorageIndicator:
              type: string
        recommendations:
          type: array
          items:
            type: string

    Alert:
      type: object
      required: [id, type, severity, status, title, description, metadata, createdAt, updatedAt, acknowledgedAt, resolvedAt]
      properties:
        id:
          type: string
        type:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [active, acknowledged, resolved]
        title:
          type: string
        description:
          type: string
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
        updatedAt:
          type: string
        acknowledgedAt:
          type: string
          nullable: true
        resolvedAt:
          type: string
          nullable: true

    AlertUpdate:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [acknowledge, resolve]

    Student:
      type: object
