openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Classmate API specification
servers:
  - url: /api
    description: Base API path
security:
  - sessionCookie: []

tags:
  - name: health
    description: Health operations
  - name: users
    description: User management (admin only)
  - name: students
    description: Student operations
  - name: teachers
    description: Teacher operations
  - name: courses
    description: Course operations
  - name: enrollments
    description: Course enrollment management
  - name: assignments
    description: Assignment operations
  - name: notes
    description: Notes and lesson content
  - name: assessments
    description: Assessment and AI suggestions
  - name: announcements
    description: Course announcements
  - name: dashboard
    description: Dashboard aggregations
  - name: reports
    description: Teacher and admin reporting endpoints
  - name: monitoring
    description: Operational monitoring endpoints (admin only)
  - name: authentication
    description: Authentication operations

paths:
  # ---- AUTHENTICATION ----
  /auth/login:
    post:
      operationId: login
      tags: [authentication]
      security: []
      summary: Authenticate with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Missing credentials
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [authentication]
      summary: End the current session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /auth/me:
    get:
      operationId: getMe
      tags: [authentication]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated


  # ---- USER MANAGEMENT ----
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserRecord"
        "403":
          description: Forbidden
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user account (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRecord"
        "400":
          description: Validation error or duplicate username
        "403":
          description: Forbidden

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRecord"
        "403":
          description: Forbidden
        "404":
          description: User not found
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user account (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRecord"
        "400":
          description: Validation error
        "403":
          description: Forbidden
        "404":
          description: User not found

  /users/{userId}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset a user password (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResult"
        "400":
          description: Validation error
        "403":
          description: Forbidden
        "404":
          description: User not found

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ---- STUDENTS ----
  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List all students
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of items per page (1–100, default 50).
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor from a previous response's pagination.nextCursor. Omit for the first page.
      responses:
        "200":
          description: Paginated list of students
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedStudentList"
    post:
      operationId: createStudent
      tags: [students]
      summary: Create a student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudentBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /students/{id}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get a student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
    patch:
      operationId: updateStudent
      tags: [students]
      summary: Update a student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentBody"
      responses:
        "200":
          description: Updated student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
    delete:
      operationId: deleteStudent
      tags: [students]
      summary: Soft-delete a student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content

  /students/{id}/progress:
    get:
      operationId: getStudentProgress
      tags: [students]
      summary: Get student progress summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProgress"

  /students/{id}/progress/timeline:
    get:
      operationId: getStudentProgressTimeline
      tags: [students]
      summary: Get chronological scored-event timeline for a student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Chronological list of scored events (oldest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProgressTimeline"
        "403":
          description: Forbidden
        "404":
          description: Student not found

  # ---- COURSES ----
  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List all courses
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Page size (default 50, max 100).
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor from a previous response's pagination.nextCursor. Omit for the first page.
      responses:
        "200":
          description: Paginated list of courses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCourseList"
    post:
      operationId: createCourse
      tags: [courses]
      summary: Create a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /courses/{id}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
    put:
      operationId: updateCourse
      tags: [courses]
      summary: Update a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseBody"
      responses:
        "200":
          description: Updated course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
    delete:
      operationId: deleteCourse
      tags: [courses]
      summary: Soft-delete a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content

  # ---- ENROLLMENTS ----
  /courses/{courseId}/enrollments:
    post:
      operationId: enrollStudent
      tags: [enrollments]
      summary: Enroll a student into a course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollStudentBody"
      responses:
        "201":
          description: Enrollment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "404":
          description: Course or student not found
        "409":
          description: Student already enrolled
        "422":
          description: Course is not active

  /courses/{courseId}/enrollments/{studentId}:
    delete:
      operationId: unenrollStudent
      tags: [enrollments]
      summary: Unenroll a student from a course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Enrollment removed
        "404":
          description: Enrollment not found

  # ---- ASSIGNMENTS ----
  /assignments:
    get:
      operationId: listAssignments
      tags: [assignments]
      summary: List assignments
      parameters:
        - name: courseId
          in: query
          required: false
          schema:
            type: integer
        - name: studentId
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of items per page (1–100, default 50).
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor from a previous response's pagination.nextCursor. Omit for the first page.
      responses:
        "200":
          description: Paginated list of assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAssignmentList"
    post:
      operationId: createAssignment
      tags: [assignments]
      summary: Create assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  /assignments/{id}:
    get:
      operationId: getAssignment
      tags: [assignments]
      summary: Get assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
    patch:
      operationId: updateAssignment
      tags: [assignments]
      summary: Update assignment (grade/status)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssignmentBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
    delete:
      operationId: deleteAssignment
      tags: [assignments]
      summary: Soft-delete an assignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content

  # ---- NOTES / LESSONS ----
  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List lesson notes/topics
      parameters:
        - name: courseId
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Page size (default 50, max 100).
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor from a previous response's pagination.nextCursor. Omit for the first page.
      responses:
        "200":
          description: Paginated list of notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedNoteList"
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a lesson note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"

  /notes/{id}:
    get:
      operationId: getNote
      tags: [notes]
      summary: Get a note/lesson
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
    patch:
      operationId: updateNote
      tags: [notes]
      summary: Update a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Soft-delete a lesson note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content

  # ---- ANNOUNCEMENTS ----
  /announcements:
    get:
      operationId: listAnnouncements
      tags: [announcements]
      summary: List course announcements
      parameters:
        - name: courseId
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Page size (default 50, max 100).
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor from a previous response's pagination.nextCursor. Omit for the first page.
      responses:
        "200":
          description: Paginated list of announcements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAnnouncementList"
    post:
      operationId: createAnnouncement
      tags: [announcements]
      summary: Create a course announcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"

  /announcements/{id}:
    get:
      operationId: getAnnouncement
      tags: [announcements]
      summary: Get an announcement by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
    patch:
      operationId: updateAnnouncement
      tags: [announcements]
      summary: Update an announcement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementUpdate"
      responses:
        "200":
          description: Updated announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
    delete:
      operationId: deleteAnnouncement
      tags: [announcements]
      summary: Soft-delete an announcement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content

  # ---- ASSESSMENTS ----
  /assessments:
    get:
      operationId: listAssessments
      tags: [assessments]
      summary: List assessments
      parameters:
        - name: studentId
          in: query
          required: false
          schema:
            type: integer
        - name: courseId
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of items per page (1–100, default 50).
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor from a previous response's pagination.nextCursor. Omit for the first page.
      responses:
        "200":
          description: Paginated list of assessments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAssessmentList"
    post:
      operationId: createAssessment
      tags: [assessments]
      summary: Submit an assessment result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssessmentBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"

  /assessments/{id}:
    get:
      operationId: getAssessment
      tags: [assessments]
      summary: Get assessment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"
    patch:
      operationId: updateAssessment
      tags: [assessments]
      summary: Update an assessment (score, title, strengths, weaknesses)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentUpdate"
      responses:
        "200":
          description: Updated assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"
    delete:
      operationId: deleteAssessment
      tags: [assessments]
      summary: Soft-delete an assessment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No Content

  /assessments/{id}/ai-suggestions:
    get:
      operationId: getAiSuggestions
      tags: [assessments]
      summary: Get AI-powered improvement suggestions for a student based on assessment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: AI suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSuggestions"

  /students/{id}/ai-suggestions:
    get:
      operationId: getStudentAiSuggestions
      tags: [assessments]
      summary: Get AI improvement suggestions for a student across all courses
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: AI suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSuggestions"

  # ---- STUDENT PORTAL ----
  /student/notes:
    get:
      operationId: getStudentNotes
      tags: [students]
      summary: List all notes visible to the authenticated student
      responses:
        "200":
          description: Note list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentNoteSummary"
        "401":
          description: Not authenticated
        "403":
          description: Access denied — caller is not a student

  /student/notes/{noteId}:
    get:
      operationId: getStudentNote
      tags: [students]
      summary: Get note detail for the authenticated student
      parameters:
        - in: path
          name: noteId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Note detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentNoteDetail"
        "400":
          description: Invalid note ID format
        "401":
          description: Not authenticated
        "403":
          description: Access denied — caller is not a student
        "404":
          description: Note not found or student not enrolled in the course

  /student/announcements:
    get:
      operationId: getStudentAnnouncements
      tags: [students]
      summary: List all announcements visible to the authenticated student
      responses:
        "200":
          description: Announcement list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentAnnouncementSummary"
        "401":
          description: Not authenticated
        "403":
          description: Access denied — caller is not a student

  /student/announcements/{announcementId}:
    get:
      operationId: getStudentAnnouncement
      tags: [students]
      summary: Get announcement detail for the authenticated student
      parameters:
        - in: path
          name: announcementId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Announcement detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAnnouncementDetail"
        "400":
          description: Invalid announcement ID format
        "401":
          description: Not authenticated
        "403":
          description: Access denied — caller is not a student
        "404":
          description: Announcement not found or student not enrolled in the course

  /student/assessments:
    get:
      operationId: getStudentAssessments
      tags: [students]
      summary: List all assessments visible to the authenticated student
      responses:
        "200":
          description: Assessment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentAssessmentSummary"
        "401":
          description: Not authenticated
        "403":
          description: Access denied — caller is not a student

  /student/assessments/{assessmentId}:
    get:
      operationId: getStudentAssessment
      tags: [students]
      summary: Get assessment detail for the authenticated student
      parameters:
        - in: path
          name: assessmentId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assessment detail
